<title>mock activity</title>
<style>#dlg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9}</style>
<script>
  window.clicks = [];
  function post(body) { return fetch('https://cf.ams.game.qq.com/ide/', {method: 'POST', body}); }
  function show(text, ms) {
    setTimeout(() => { document.getElementById('txt').innerText = text; document.getElementById('dlg').style.display = 'block'; }, ms || 0);
  }
  function hit(name) { window.clicks.push(name); }
  var q = new URLSearchParams(location.search);
  if (q.get('load')) show(q.get('load'), 800);
</script>
